apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: freeflix
  namespace: freeflix
  labels:
    app.kubernetes.io/name: freeflix
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    # Option 1: Access via local or custom domain (e.g. freeflix.local or freeflix.randikalakshan.site)
    - host: freeflix.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: freeflix
                port:
                  number: 80
    # Option 2: Fallback path-based routing (catches any host pointing to Pi IP)
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: freeflix
                port:
                  number: 80
